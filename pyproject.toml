[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-py-mcp"
version = "0.1.0"
description = "My MCP For Rest APIs"
authors = [{name = "Vishal Chawla", email = "vishalc412@gmail.com"}]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "aiosqlite",
    "mcp",
    "aiohttp",
    "httpx",
    "pytest",
    "pytest-asyncio"
]

[tool.setuptools]
packages = ["model"]

