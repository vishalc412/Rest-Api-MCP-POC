version: "3.9"

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vita:vita@db:5432/vitaclan
      SYNC_DATABASE_URL: postgresql://vita:vita@db:5432/vitaclan
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: vitaclan-docs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      JWT_SECRET: dev-secret-change-in-prod
      FIREBASE_PROJECT_ID: your-firebase-project-id
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      minio:
        condition: service_started
      chromadb:
        condition: service_started
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vita:vita@db:5432/vitaclan
      SYNC_DATABASE_URL: postgresql://vita:vita@db:5432/vitaclan
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: vitaclan-docs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      ENVIRONMENT: development
    depends_on:
      - db
      - redis
      - ollama
    volumes:
      - ../backend:/app
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=ocr,reminders,default

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vita:vita@db:5432/vitaclan
      SYNC_DATABASE_URL: postgresql://vita:vita@db:5432/vitaclan
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      - db
      - redis
    volumes:
      - ../backend:/app
    command: celery -A app.worker.celery_app beat --loglevel=info

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vitaclan
      POSTGRES_USER: vita
      POSTGRES_PASSWORD: vita
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vita -d vitaclan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (uncomment if NVIDIA GPU available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  minio_data:
  chroma_data:
